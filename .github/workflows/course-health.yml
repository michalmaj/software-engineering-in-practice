name: Course health

on:
  push:
    branches: [main]
  pull_request:

jobs:
  course-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.21"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Validates every committed Gradle Wrapper's checksum before any
      # ./gradlew invocation runs, and caches Gradle's own downloads.
      - uses: gradle/actions/setup-gradle@v6

      - name: Run course health checks
        run: ./scripts/check-course.sh
